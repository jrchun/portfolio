# 매일 07:30(한국 시간) 보유 종목의 전일 종가와 환율을 받아 Cloudflare D1에 저장한다.
# 필요한 설정(저장소 Settings > Secrets and variables > Actions):
#   Secrets:   CLOUDFLARE_API_TOKEN  (D1 Write 권한만 가진 토큰)
#   Variables: CF_ACCOUNT_ID, CF_D1_DATABASE_ID
# 주의: 예약 실행은 기본 브랜치에 이 파일이 있어야 동작한다. Actions 탭에서 손으로도 실행할 수 있다.
name: fetch-prices

on:
  schedule:
    - cron: '30 22 * * *' # 매일 07:30 KST (GitHub 사정으로 몇 분~수십 분 늦을 수 있다)
  workflow_dispatch: {}

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Fetch prices
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
        run: uv run --no-dev python -m server.jobs.fetch_prices
