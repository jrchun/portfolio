# Cloudflare Worker 설정(이 파일이 기준이다). 대시보드의 Worker 이름과 name이 같아야 한다.
# 편집 암호(WRITE_TOKEN)는 비밀값이라 여기 두지 않고 대시보드 > Worker > 설정 > 변수 및 비밀에서 넣는다.
name = "rebalance-board"
main = "./src/worker.js"
compatibility_date = "2026-11-01"
send_metrics = false

# 정적 파일. 요청과 맞는 파일이 있으면 Worker를 거치지 않고 바로 보낸다.
[assets]
directory = "./web"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "rebalance-board"
database_id = "19a9b049-8612-4eb1-a692-98ba466aa4f1"
